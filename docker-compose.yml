version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: photo_user
      POSTGRES_PASSWORD: photo_password
      POSTGRES_DB: photo_analyzer
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_user -d photo_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
