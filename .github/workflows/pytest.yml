name: CI — pytest

on:
  push:
    branches:
      - main
      - beta
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - beta

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      # Use a single, supported Python version to avoid runner lookup errors
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure pytest is available even if requirements.txt is missing or environment differs
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest (debug collect)
        run: |
          # Debug: print working directory and list files so CI logs show whether tests are present
          pwd
          ls -la
          echo "Python: $(python --version)" 
          echo "Pip packages:"
          pip list --format=columns
          # First run a collect-only to show what pytest finds on the runner
          python -m pytest -q --collect-only -vv || true

      - name: Run pytest
        run: |
          # Invoke pytest via the python module to avoid PATH/entrypoint issues
          python -m pytest -q
