{% extends 'base.html' %}

{% block title %}Admin Sign In{% endblock %}

{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="mb-3">Admin sign in</h2>
        <p class="text-muted">Enter the admin password to access the admin dashboard.</p>
        <form method="post" action="{{ url_for('admin_login') }}">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" required autofocus>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-primary" type="submit">Sign in</button>
            <a class="btn btn-link" href="{{ url_for('main_dashboard') }}">Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
