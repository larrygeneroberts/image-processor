{% extends 'base.html' %}

{% block title %}Direct Thumbnail Test{% endblock %}

{% block head_extra %}
<style>
    body { font-family: Arial, sans-serif; }
    .photo { display:inline-block; margin:10px; border:1px solid #ccc; padding:10px; }
    .photo img { width:150px; height:150px; object-fit:cover; }
    .error { color: red; }
</style>
{% endblock %}

{% block content %}
    <div class="container py-4">
        <h3>Direct Thumbnail Test</h3>
        <p id="status" class="text-muted">This helper page shows thumbnails when called directly.</p>
        <div id="photos">Use the admin pages or thumbnails endpoints directly.</div>
    </div>
{% endblock %}
